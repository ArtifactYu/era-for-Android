name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install .NET Android workload
        run: |
          dotnet workload install android
          dotnet workload list

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          dotnet build src/EraFlow.Android/EraFlow.Android.csproj \
            -c Release \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT \
            -p:JavaSdkDirectory=$JAVA_HOME \
            -p:AndroidKeyStore=false

      - name: Locate and upload APK
        run: |
          echo "=== 查找 APK ==="
          find src/EraFlow.Android/bin -name "*.apk" -type f | tee apk-list.txt
          mkdir -p out
          find src/EraFlow.Android/bin -name "*.apk" -type f -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: era-for-android-external-dirs
          path: out/*.apk
          retention-days: 30
