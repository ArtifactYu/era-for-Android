<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>era for Android</title>
<style>
:root{--bg:#f5f7f0;--surface:#e9ede2;--ink:#202b1c;--muted:#687160;--primary:#355b29;--accent:#d3f1b4;--line:#d9dfd0;--lav:#e6dcf7;font-family:system-ui,-apple-system,'Noto Sans',sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #669546;outline-offset:3px}button:active{transform:scale(.95);border-radius:18px!important}button{transition:transform .17s cubic-bezier(.2,.8,.2,1),border-radius .25s,background .2s}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{max-width:1100px;margin:auto;padding:26px 24px 120px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{font-size:22px;font-weight:700;letter-spacing:-.8px;display:flex;align-items:center;gap:9px}.mark{display:grid;place-items:center;background:var(--primary);color:var(--accent);width:34px;height:34px;border-radius:12px;transform:rotate(-8deg);font-size:23px}.icon{display:grid;place-items:center;width:48px;height:48px;background:var(--surface);border-radius:50%}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:600}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 24px}h1{font-size:46px;line-height:1.15;letter-spacing:-2px;margin:9px 0 0;font-weight:680}.count{border:1px solid var(--line);border-radius:24px;font-size:13px;padding:8px 13px;color:var(--muted)}.hero{background:var(--accent);padding:26px;border-radius:30px;min-height:196px;position:relative;overflow:hidden;margin-bottom:24px}.hero h2{margin:8px 0 20px;font-size:27px;letter-spacing:-1px;max-width:70%;line-height:1.28}.hero p{color:#567044;font-size:13px;margin:0}.primary{background:var(--primary);color:#fff;padding:14px 22px;border-radius:50px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px}.primary svg{width:18px;height:18px}.flower{position:absolute;width:142px;height:142px;right:-4px;top:20px;transform:rotate(13deg);opacity:.7}.flower svg{width:100%;height:100%;stroke-width:1.2;stroke:#719655}.toolbar{display:flex;align-items:center;gap:10px;margin:26px 0 20px}.search{display:flex;align-items:center;gap:10px;border-radius:50px;background:var(--surface);padding:0 16px;height:50px;flex:1}.search svg{width:20px;color:var(--muted)}.search input{outline:none!important;border:0;width:100%;background:none;color:var(--ink);font-size:14px}.sectionline{display:flex;align-items:center;justify-content:space-between;margin:28px 3px 14px}.sectionline h2{font-size:17px;margin:0;font-weight:650}.textbtn{font-size:13px;background:none;color:var(--primary);min-height:44px;padding:0 7px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.card{background:var(--surface);border-radius:24px;position:relative;overflow:hidden;min-width:0;transition:background .2s}.card:hover{background:#e0e7d7}.cardmain{background:none;width:100%;padding:20px;display:flex;align-items:center;text-align:left;gap:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.tile{width:58px;height:66px;display:grid;place-items:center;border-radius:18px 18px 7px 18px;flex:none;font-size:26px;font-weight:500;position:relative}.tile:after{content:'';position:absolute;right:6px;bottom:7px;width:17px;height:2px;background:currentColor;opacity:.3}.cardtext{min-width:0;flex:1}.cardtext h3{font-size:16px;font-weight:650;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);display:flex;gap:10px}.cardfooter{border-top:1px solid var(--line);padding:1px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.more{height:42px;width:42px;display:grid;place-items:center;border-radius:15px;background:none}.more svg{width:21px}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:44px 22px 24px}.empty svg{width:56px;height:56px;stroke:#7a926c;stroke-width:1.1}.empty h3{font-size:19px;margin:4px 0}.empty p{font-size:13px;line-height:1.7;margin:0;color:var(--muted);max-width:260px}.fab{position:fixed;bottom:26px;right:24px;display:flex;align-items:center;gap:12px;padding:19px 23px;border-radius:21px;background:var(--lav);color:#493e62;font-size:15px;font-weight:650;box-shadow:0 5px 18px #28352018;z-index:3}.backdrop{position:fixed;inset:0;background:#18231355;z-index:9;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}.backdrop[hidden]{display:none}.sheet{width:100%;max-width:560px;border-radius:32px 32px 0 0;background:var(--bg);padding:10px 24px 30px;animation:rise .3s cubic-bezier(.2,.8,.2,1)}.handle{width:34px;height:4px;border-radius:5px;background:#b7c0ac;margin:0 auto 23px}.sheet h2{font-size:24px;margin:0 0 22px;word-break:break-word}.choice{width:100%;display:flex;align-items:center;gap:18px;border-radius:20px;padding:18px;background:var(--surface);text-align:left;margin:9px 0}.choice span{display:block;font-size:15px}.choice small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.choice>svg{width:26px;height:26px}.choice.danger{background:#f8e0dc}.choice.danger>svg{color:#b3261e}.choice.danger span{color:#8c1d18}.choice.danger small{color:#a05a52}.sheet .cancel{display:block;margin:13px auto 0;background:none;color:var(--primary);padding:12px 32px;border-radius:50px}.toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,15px);background:#293423;color:#f5f7f0;padding:14px 20px;border-radius:18px;max-width:90%;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;inset:0;background:#f5f7f0e8;z-index:20;display:grid;place-content:center;text-align:center;gap:22px}.loading[hidden]{display:none}.spinner{width:48px;height:48px;border:5px solid var(--accent);border-top-color:var(--primary);border-radius:38% 62% 50% 45%;margin:auto;animation:spin 1s linear infinite}.loading p{font-size:14px;color:var(--muted)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}@media(min-width:700px){main{padding:32px 40px 110px}.hero{padding:30px;min-height:190px}.flower{right:30px;width:185px;height:185px;top:-6px}.hero h2{font-size:31px;max-width:75%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.backdrop{align-items:center}.sheet{border-radius:30px;padding:22px 28px}.handle{display:none}.fab{right:40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<svg style="display:none"><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/><path d="M3 9h18"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol><symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="archive" viewBox="0 0 24 24"><path d="M5 8v12h14V8M3 4h18v4H3zM10 12h4"/></symbol><symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol></svg>
<main><header class="top"><div class="brand"><span class="mark">e</span> era for Android</div><button class="icon" aria-label="关于 era for Android" onclick="native('about')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/></svg></button></header>
<div class="heading"><div><div class="eyebrow">YOUR LITTLE UNIVERSE</div><h1>游戏库</h1></div><span class="count" id="count">0 个游戏</span></div>
<section class="hero"><p id="heroLabel">文字之间，自有世界。</p><h2 id="heroTitle">下一段故事，<br>从这里开始。</h2><button class="primary" id="heroAction" onclick="openImport()">导入游戏 <svg><use href="#arrow"/></svg></button><div class="flower" aria-hidden="true"><svg viewBox="0 0 160 160"><path d="M80 40C36-14 0 44 40 80C-14 124 44 160 80 120C124 174 160 116 120 80C174 36 116 0 80 40Z"/><path d="M80 48C45 8 16 47 48 80C8 115 47 144 80 112C115 152 144 113 112 80C152 45 113 16 80 48Z"/><circle cx="80" cy="80" r="10"/></svg></div></section>
<div class="toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" placeholder="搜索游戏" aria-label="搜索游戏" oninput="render()"></label><button class="icon" aria-label="扫描已授权目录" onclick="native('scan')"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.5 7a8 8 0 0 1 13-1L20 9M4 15l1.5 3a8 8 0 0 0 13-1"/></svg></button></div>
<div class="sectionline"><h2>全部游戏</h2><button class="textbtn" id="sort" onclick="reverseSort=!reverseSort;render()">最近游玩</button></div><div class="grid" id="games"></div><div class="empty" id="empty"><svg viewBox="0 0 64 64"><path d="M12 14h17l6 7h18v31H12z"/><path d="M22 34h20M22 41h13M36 11l4-4M46 16h5"/></svg><h3>把喜欢的故事带在身边</h3><p>选择包含 ERB 和 CSV 的游戏目录，<br>或直接导入 ZIP 压缩包。</p></div>
</main><button class="fab" onclick="openImport()"><svg><use href="#plus"/></svg> 导入游戏</button>
<div class="backdrop" id="modal" hidden onclick="if(event.target===this)closeModal()"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><h2 id="sheetTitle">导入游戏</h2><div id="choices"></div><button class="cancel" onclick="closeModal()">取消</button></section></div>
<div class="loading" id="loading" hidden><div class="spinner"></div><p id="progress" role="status">正在读取文件…</p></div><div class="toast" id="toast" role="status"></div>
<script>
let games=[],reverseSort=false,toastTimer,lastFocus,pressTimer=0,longPressed=false,pressX=0,pressY=0;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function native(action,id){if(window.Android)Android.call(JSON.stringify({action,id}));else if(action!=='ready')message('请在安卓应用中使用此功能');}
function message(v){$('toast').textContent=v;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),3600)}
function relative(t){if(!t)return '尚未游玩';const days=Math.floor((Date.now()-t)/86400000);return days===0?'今天玩过':days===1?'昨天玩过':days+' 天前玩过'}
function render(){const q=$('search').value.toLowerCase(),shown=games.filter(g=>g.name.toLowerCase().includes(q));if(reverseSort)shown.sort((a,b)=>a.name.localeCompare(b.name,'zh'));$('sort').textContent=reverseSort?'按名称':'最近游玩';$('count').textContent=games.length+' 个游戏';$('empty').hidden=shown.length>0;$('empty').style.display=shown.length?'none':'flex';$('empty').querySelector('h3').textContent=q?'没有找到这个游戏':'把喜欢的故事带在身边';$('empty').querySelector('p').innerHTML=q?'试试其他关键词。':'选择包含 ERB 和 CSV 的游戏目录，<br>或直接导入 ZIP 压缩包。';const colors=[['#d8e8cb','#4f6942'],['#e5dcf4','#756087'],['#f0e0ce','#8a6a44'],['#d3e6e8','#4c777a']];$('games').innerHTML=shown.map((g,i)=>`<article class="card"><button class="cardmain" data-play="${esc(g.id)}" aria-label="游玩 ${esc(g.name)}"><div class="tile" style="background:${colors[i%4][0]};color:${colors[i%4][1]}">${esc(g.name.replace(/^era/i,'').slice(0,1)||'e')}</div><div class="cardtext"><h3>${esc(g.name)}</h3><div class="meta"><span>${g.scripts.toLocaleString()} 段脚本</span><span>${g.images?'含图片':'文字'}</span></div></div><svg style="width:20px;flex:none"><use href="#arrow"/></svg></button><div class="cardfooter"><span>${relative(g.lastPlayed)}</span><button class="more" data-more="${esc(g.id)}" aria-label="${esc(g.name)}的选项"><svg><use href="#dots"/></svg></button></div></article>`).join('');document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{if(longPressed){longPressed=false;return}native('play',b.dataset.play)});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>options(b.dataset.more));const recent=games.find(g=>g.lastPlayed);if(recent){$('heroLabel').textContent='最近的世界';$('heroTitle').textContent=recent.name;$('heroAction').innerHTML='再次出发 <svg><use href="#arrow"/></svg>';$('heroAction').onclick=()=>native('play',recent.id);}else{$('heroLabel').textContent='文字之间，自有世界。';$('heroTitle').innerHTML='下一段故事，<br>从这里开始。';$('heroAction').innerHTML='导入游戏 <svg><use href="#arrow"/></svg>';$('heroAction').onclick=openImport;}}
function choice(icon,title,sub,action,danger){const b=document.createElement('button');b.className='choice'+(danger?' danger':'');b.innerHTML=`<svg><use href="#${icon}"/></svg><div><span>${esc(title)}</span><small>${esc(sub)}</small></div>`;b.onclick=()=>{closeModal();action()};$('choices').appendChild(b)}
function show(title){lastFocus=document.activeElement;$('sheetTitle').textContent=title;$('choices').innerHTML='';$('modal').hidden=false;}
function openImport(){show('导入游戏');choice('folder','选择目录','自动发现目录中的游戏',()=>native('folder'));choice('archive','导入 ZIP','保留游戏中的文字与图片',()=>native('zip'));$('choices').querySelector('button').focus()}
function options(id){const g=games.find(g=>g.id===id);show(g.name);choice('archive','导出存档','备份到你选择的位置',()=>native('export',id));choice('folder','恢复存档','从 ZIP 备份恢复',()=>native('restore',id));choice('trash','删除游戏','从本机移除游戏与存档',()=>native('delete',id),true);$('choices').querySelector('button').focus()}
function closeModal(){$('modal').hidden=true;lastFocus?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('modal').hidden){const bs=[...$('modal').querySelectorAll('button')],a=bs[0],z=bs.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function pressCard(e){if(e.target.closest?.('[data-more]'))return;const card=e.target.closest?.('.card');return card?.querySelector('[data-play]')}
document.addEventListener('pointerdown',e=>{longPressed=false;const play=pressCard(e);clearTimeout(pressTimer);if(!play)return;pressX=e.clientX;pressY=e.clientY;pressTimer=setTimeout(()=>{longPressed=true;native('haptic');native('delete',play.dataset.play)},550)});
document.addEventListener('pointermove',e=>{if(pressTimer&&(Math.abs(e.clientX-pressX)>12||Math.abs(e.clientY-pressY)>12)){clearTimeout(pressTimer);pressTimer=0}});
document.addEventListener('pointerup',()=>{clearTimeout(pressTimer);pressTimer=0});
document.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);pressTimer=0});
document.addEventListener('contextmenu',e=>{const card=e.target.closest?.('.card');if(card&&card.querySelector('[data-play]'))e.preventDefault()});
window.Era={library:data=>{games=data.games;render()},message,progress:v=>{$('loading').hidden=!v;$('progress').textContent=v||''},back:()=>{if(!$('modal').hidden)closeModal();else if($('search').value){$('search').value='';render()}else native('exit')}};native('ready');
</script></body></html>
